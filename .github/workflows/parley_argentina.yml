name: Parley Sudamerica

on:
  # schedule:
  #   - cron: '0 13 * * *'   # 8 AM Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parley:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y paquete
        run: |
          pip install -r requirements.txt
          pip install .
      - env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ_LOCAL: America/Bogota
        run: python -m parley.cli --provider bzzoiro
